server {
    listen 80;
    listen [::]:80;
    server_name codex.starvalley.fun;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex.starvalley.fun;
    ssl_certificate /etc/letsencrypt/live/starvalley.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starvalley.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        gzip on;
        gzip_types text/css text/javascript application/javascript application/json application/wasm;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
    }
}
