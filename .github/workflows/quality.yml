name: Quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install application and development dependencies
        run: npm ci --no-audit --no-fund
      - name: Install archive test tools
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:types
      - run: npm test
      - run: npm run build
