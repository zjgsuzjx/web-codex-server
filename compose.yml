services:
  web:
    image: starvalley-codex-web:local
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports: ["127.0.0.1:3100:3100"]
    group_add: ["${DOCKER_GID:-988}"]
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
